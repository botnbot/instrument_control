<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Instrument Control{% endblock %}</title>
    <!-- Подключаем Bootstrap -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        .info-table-link {
            color: black;
            text-decoration: none;
        }
        .info-table-link:hover {
            text-decoration: underline;
            color: black;
        }
    </style>
</head>
<body>
    <!-- Навигационное меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:instrument_list' %}">Instrument Control</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'core:instrument_list' %}">Инструменты</a>
                <a class="nav-link" href="{% url 'core:repairer_list' %}">Ремонтники</a>
                <a class="nav-link" href="{% url 'core:repair_list' %}">Ремонты</a>
                <a class="nav-link" href="{% url 'core:relocation_list' %}">Перемещения</a>
                <a class="nav-link" href="/admin/">Админка</a>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
