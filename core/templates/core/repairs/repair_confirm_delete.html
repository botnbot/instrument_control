{% extends 'base.html' %}

{% block title %}
Удаление ремонта
{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body text-center">
        <h2>Удалить ремонт: {{ object.id }}</h2>
        <p>Вы уверены?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">Удалить</button>
            <a href="{% url 'core:repair_list' %}" class="btn btn-secondary btn-lg ms-2">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
