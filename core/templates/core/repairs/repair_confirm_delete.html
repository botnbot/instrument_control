{% extends 'base.html' %}

{% block title %}
Удаление ремонта
{% endblock %}

{% block content %}

<div class="container mt-5">
    <h1 class="mb-4">Удалить ремонт</h1>
    <p>Вы уверены, что хотите удалить ремонт"{{ object.id }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            Удалить
        </button>
        <a href="{% url 'core:repair_list' %}" class="btn btn-secondary">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
