{% extends "base.html" %}

{% block content %}
<h2>Отправить инструмент в ремонт</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <div class="text-danger">{{ field.errors }}</div>
        {% endif %}
    </div>
    {% endfor %}
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
