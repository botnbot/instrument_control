{% extends "base.html" %}

{% block title %}
Instrument Form
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>
        {% if object %}
            Edit Repairer
        {% else %}
            Create Repairer
        {% endif %}
    </h2>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save
        </button>

        <a href="{% url 'core:repairer_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
