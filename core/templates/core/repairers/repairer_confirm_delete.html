{% extends 'base.html' %}

{% block title %}
Удаление мастерской
{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body text-center">
        <h2>Удалить ремонтника: {{ object.name }}</h2>
        <p>Вы уверены?</p>
        <form method="post" class="text-center">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">
                <i class="bi bi-trash"></i> Удалить
            </button>
            <a href="{% url 'core:repairer_list' %}" class="btn btn-secondary btn-lg ms-2">
                Отмена
            </a>
        </form>
    </div>
</div>
{% endblock %}
