{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>
        {% if form.instance.pk %}
            Редактировать инструмент
        {% else %}
            Создать инструмент
        {% endif %}
    </h2>

    <form method="post" enctype="multipart/form-data">>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'core:instruments_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
